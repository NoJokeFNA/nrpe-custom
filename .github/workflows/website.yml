name: Documentation website
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    name: Static website and links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Locate the diagram build browser
        run: |
          diagram_browser=$(command -v google-chrome || command -v chromium)
          "$diagram_browser" --version
          printf 'NRPE_WEBSITE_BROWSER=%s\n' "$diagram_browser" >> "$GITHUB_ENV"
      - name: Install pinned build-only syntax grammars
        run: npm ci --prefix website --ignore-scripts --no-fund
      - name: Audit the syntax highlighter
        run: npm audit --prefix website --audit-level=low
      - name: Install the isolated website renderer
        run: python -m pip install -r requirements-website.txt -r requirements-audit.txt
      - name: Audit the renderer dependency
        run: python -m pip_audit --strict -r requirements-website.txt
      - name: Test rendering and guarded publication
        run: python -m unittest discover -s website/tests -v
      - name: Build and check every internal page and anchor
        run: python website/build.py
      - uses: actions/upload-artifact@v6
        with:
          name: documentation-preview
          path: .nrpe/site/nrpe-custom/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
