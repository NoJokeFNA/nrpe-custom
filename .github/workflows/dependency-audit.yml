name: Python dependency audit

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  workflow_call:
  push:
    branches: [develop]
    paths:
      - 'requirements-*.txt'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    paths:
      - 'requirements-*.txt'
      - '.github/workflows/dependency-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned audit tool
        run: python -m pip install -r requirements-audit.txt
      - name: Check the menu dependency set against published advisories
        run: python -m pip_audit --strict -r requirements-menu.txt
