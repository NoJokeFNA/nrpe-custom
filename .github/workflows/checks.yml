name: Checks

on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [develop, master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/master' && github.run_id || 'latest' }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional menu dependencies
        run: python -m pip install -r requirements-menu.txt
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v

  configuration:
    name: Shell and Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check shell syntax
        shell: bash
        run: |
          for script in scripts/*.sh examples/*.sh; do
            bash -n "$script" || exit
          done
      - name: Validate both Compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.test.yaml --profile integration config --quiet
