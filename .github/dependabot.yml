version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      menu-dependencies:
        patterns: ['prompt-toolkit', 'wcwidth']
      website-renderer:
        patterns: ['Markdown', 'markdown']
      audit-tools:
        patterns: ['pip-audit']
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /website
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      website-build-dependencies:
        patterns: ['*']
