# Run with Docker Compose from the repository root.
# Every service builds natively for linux/amd64, even on ARM workstations.
x-nrpe-build: &nrpe-build
  platform: linux/amd64
  volumes:
    - type: bind
      source: ./output
      target: /output

services:
  archlinux:
    <<: *nrpe-build
    profiles: [optional]
    build:
      context: .
      dockerfile: docker/archlinux/build.Dockerfile
      secrets: [nrpe_ca_cert]
      args:
        NRPE_CA_SHA256: ${NRPE_CA_SHA256:-none}
    image: nrpe-custom-builder:archlinux
  sles12sp3:
    <<: *nrpe-build
    build:
      context: .
      dockerfile: docker/sles12sp3/build.Dockerfile
      secrets:
        - nrpe_ca_cert
      args:
        NRPE_CA_SHA256: ${NRPE_CA_SHA256:-none}
        SLES_BASE_IMAGE: ${SLES_BASE_IMAGE:-registry.suse.com/suse/sles12sp3@sha256:0995dbf051274a3a5baf19c7f94ce7ebe69d7aa91f7b3b22248bd06d7122e53a}
    image: nrpe-custom-builder:sles12sp3
    volumes:
      - ./output:/output
  debian11:
    <<: *nrpe-build
    build:
      context: .
      dockerfile: docker/debian/build.Dockerfile
      secrets:
        - nrpe_ca_cert
      args:
        NRPE_CA_SHA256: ${NRPE_CA_SHA256:-none}
        DEBIAN_CODENAME: bullseye
    image: nrpe-custom-builder:bullseye
    environment:
      DEBIAN_CODENAME: bullseye
      DEBIAN_NUMBER: "11"
  debian12:
    <<: *nrpe-build
    build:
      context: .
      dockerfile: docker/debian/build.Dockerfile
      secrets:
        - nrpe_ca_cert
      args:
        NRPE_CA_SHA256: ${NRPE_CA_SHA256:-none}
        DEBIAN_CODENAME: bookworm
    image: nrpe-custom-builder:bookworm
    environment:
      DEBIAN_CODENAME: bookworm
      DEBIAN_NUMBER: "12"
  debian13:
    <<: *nrpe-build
    build:
      context: .
      dockerfile: docker/debian/build.Dockerfile
      secrets:
        - nrpe_ca_cert
      args:
        NRPE_CA_SHA256: ${NRPE_CA_SHA256:-none}
        DEBIAN_CODENAME: trixie
    image: nrpe-custom-builder:trixie
    environment:
      DEBIAN_CODENAME: trixie
      DEBIAN_NUMBER: "13"
  debian14:
    <<: *nrpe-build
    build:
      context: .
      dockerfile: docker/debian/build.Dockerfile
      secrets:
        - nrpe_ca_cert
      args:
        NRPE_CA_SHA256: ${NRPE_CA_SHA256:-none}
        DEBIAN_CODENAME: forky
    image: nrpe-custom-builder:forky
    environment:
      DEBIAN_CODENAME: forky
      DEBIAN_NUMBER: "14"

# nrpe.py supplies validated PEM; an empty value adds no extra CA.
secrets:
  nrpe_ca_cert:
    environment: NRPE_CA_PEM
