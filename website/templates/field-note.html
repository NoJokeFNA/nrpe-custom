<main id="main" class="blog-article">
<header class="field-note-header">
<a class="back-link" href="${base}/field-notes/">← All field notes</a>
<p class="article-label">${article_label}</p>
<h1>${title}</h1>
</header>
<div class="field-note-layout">
<div class="field-note-main">
<article class="prose">${content}</article>
${source_link}
</div>
<aside class="page-toc field-note-toc" aria-label="Article sections">
<details class="article-outline" open>
<summary>On this page</summary>
${toc}
</details>
</aside>
</div>
</main>
