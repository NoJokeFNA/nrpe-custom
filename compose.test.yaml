# Opt-in integration tests; normal Compose builds do not start these services.
x-nrpe-test: &nrpe-test
  platform: linux/amd64
  profiles: [integration]

services:
  test-archlinux:
    <<: *nrpe-test
    build:
      context: .
      dockerfile: docker/archlinux/test.Dockerfile
      secrets: [nrpe_ca_cert]
      args:
        NRPE_CA_SHA256: ${NRPE_CA_SHA256:-none}
    image: nrpe-custom-test:archlinux
    volumes:
      - ./output/archlinux:/packages:ro
  test-sles12sp3:
    <<: *nrpe-test
    build:
      context: .
      secrets:
        - nrpe_ca_cert
      dockerfile: docker/sles12sp3/test.Dockerfile
      args:
        NRPE_CA_SHA256: ${NRPE_CA_SHA256:-none}
        SLES_BASE_IMAGE: ${SLES_BASE_IMAGE:-registry.suse.com/suse/sles12sp3@sha256:0995dbf051274a3a5baf19c7f94ce7ebe69d7aa91f7b3b22248bd06d7122e53a}
    volumes:
      - ./output/sles12sp3:/packages:ro
  test-debian11:
    <<: *nrpe-test
    build:
      context: .
      secrets:
        - nrpe_ca_cert
      dockerfile: docker/debian/test.Dockerfile
      args:
        NRPE_CA_SHA256: ${NRPE_CA_SHA256:-none}
        DEBIAN_CODENAME: bullseye
    environment:
      DEBIAN_CODENAME: bullseye
    volumes:
      - ./output/debian11:/packages:ro
  test-debian12:
    <<: *nrpe-test
    build:
      context: .
      secrets:
        - nrpe_ca_cert
      dockerfile: docker/debian/test.Dockerfile
      args:
        NRPE_CA_SHA256: ${NRPE_CA_SHA256:-none}
        DEBIAN_CODENAME: bookworm
    environment:
      DEBIAN_CODENAME: bookworm
    volumes:
      - ./output/debian12:/packages:ro
  test-debian13:
    <<: *nrpe-test
    build:
      context: .
      secrets:
        - nrpe_ca_cert
      dockerfile: docker/debian/test.Dockerfile
      args:
        NRPE_CA_SHA256: ${NRPE_CA_SHA256:-none}
        DEBIAN_CODENAME: trixie
    environment:
      DEBIAN_CODENAME: trixie
    volumes:
      - ./output/debian13:/packages:ro
  test-debian14:
    <<: *nrpe-test
    build:
      context: .
      secrets:
        - nrpe_ca_cert
      dockerfile: docker/debian/test.Dockerfile
      args:
        NRPE_CA_SHA256: ${NRPE_CA_SHA256:-none}
        DEBIAN_CODENAME: forky
    environment:
      DEBIAN_CODENAME: forky
    volumes:
      - ./output/debian14:/packages:ro

# nrpe.py supplies validated PEM; an empty value adds no extra CA.
secrets:
  nrpe_ca_cert:
    environment: NRPE_CA_PEM
